# R CMD check on every push and pull request to main. A push to main that
# passes also uploads test coverage to Codecov and re-renders the site's
# repdist.html on gh-pages from main's vignette.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # no --as-cran: it runs \donttest examples, and embed_proteins()'s
          # downloads the Python environment and a model
          args: 'c("--no-manual")'
          upload-snapshots: true

      - name: Test coverage
        if: github.event_name == 'push'
        continue-on-error: true # until the repository is added on codecov.io
        run: covr::codecov()
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  site:
    # The site's "Get started" page is main's vignette. It is rendered inside
    # a gh-pages checkout with render_site(), which gives it the site's navbar
    # and theme from _site.yml; a bare render of the vignette replaced the page
    # without them. Only repdist.html and repdist_files/ change.
    needs: R-CMD-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes a commit to gh-pages
    concurrency:
      group: site
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: main
          extra-packages: local::.

      - name: Render the vignette into the site
        working-directory: site
        run: |
          rm -rf repdist_files
          cp ../main/vignettes/repdist.Rmd repdist.Rmd
          Rscript -e 'rmarkdown::render_site("repdist.Rmd")'
          rm repdist.Rmd

      - name: Commit the page
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repdist.html repdist_files
          if git diff --cached --quiet; then
            echo "The site already shows this vignette."
          else
            git commit -m "Site: render the vignette from ${GITHUB_SHA::7} on main"
            git push
          fi
