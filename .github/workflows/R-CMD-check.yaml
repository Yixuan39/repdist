# R CMD check on every push and pull request to main. A push to main that
# passes also uploads test coverage to Codecov and publishes the rendered
# vignette to the gh-pages site, so the site always shows main's vignette.
name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # the gh-pages deploy pushes a commit

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # no --as-cran: it runs \donttest examples, and embed_proteins()'s
          # downloads the Python environment and a model
          args: 'c("--no-manual")'
          upload-snapshots: true

      - name: Test coverage
        if: github.event_name == 'push'
        continue-on-error: true # until the repository is added on codecov.io
        run: covr::codecov()
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Render the vignette for the site
        if: github.event_name == 'push'
        run: rmarkdown::render("vignettes/repdist.Rmd", output_dir = "_site")
        shell: Rscript {0}

      - uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name == 'push'
        with:
          branch: gh-pages
          folder: _site
          clean: false # replace only this page, keep the rest of the site
