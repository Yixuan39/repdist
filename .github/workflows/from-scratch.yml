name: from-scratch
on: {push: {branches: ["ci/**"]}}
jobs:
  uv-debug:
    runs-on: ubuntu-latest
    container: rocker/r-ver:latest
    steps:
      - run: apt-get update && apt-get install -y libpng-dev
      - run: |
          for p in $(which -a python3 python git 2>/dev/null); do mv -f "$p" "$p.hidden" || true; done
          which curl wget tar gzip || true
          Rscript -e 'install.packages("reticulate")'
      - name: without curl
        env: {_RETICULATE_DEBUG_UV_: "1"}
        continue-on-error: true
        run: Rscript -e 'print(reticulate:::uv_binary())'
      - name: with curl
        run: |
          apt-get install -y curl
          Rscript -e 'out <- reticulate::uv_run_tool("python", c("-c", shQuote("import sys; print(sys._base_executable)")), python_version = "3.11.9", stdout = TRUE, stderr = TRUE); print(out)'
